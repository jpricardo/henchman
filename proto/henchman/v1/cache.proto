syntax = "proto3";
package henchman.v1;
option go_package = "github.com/jpricardo/henchman";


service Cache {
  rpc Register (RegisterRequest)  returns (RegisterResponse);
  rpc Get      (GetRequest)       returns (GetResponse);
  rpc Set      (SetRequest)       returns (SetResponse);
  rpc Delete   (DeleteRequest)    returns (DeleteResponse);
  rpc Query    (QueryRequest)     returns (QueryResponse);
  rpc Flush    (FlushRequest)     returns (FlushResponse);
}

message RegisterRequest {
  string         instance_id = 1;
  InstanceConfig config      = 2;
}

message InstanceConfig {
  int64  max_bytes         = 1;
  int64  max_keys          = 2;
  int64  default_ttl_ms    = 3;
  string eviction_policy   = 4;
  int64  sweep_interval_ms = 5;
}

message RegisterResponse {
  string token = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool  found = 1;
  bytes value = 2;
}

message SetRequest {
  string key                   = 1;
  bytes  value                 = 2;
  int64  ttl_ms                = 3; // 0 = use instance default
  bool   invalidate_after_read = 4;
}

message SetResponse {}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {}

message QueryRequest {
  oneof matcher {
    string exact_key  = 1;
    string key_prefix = 2;
  }
  bool invalidate_matched = 3;
}

message QueryResponse {
  repeated KeyValue entries = 1;
}

message KeyValue {
  string key   = 1;
  bytes  value = 2;
}

message FlushRequest {}

message FlushResponse {}